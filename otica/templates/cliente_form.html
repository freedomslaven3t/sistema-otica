{% extends 'base.html' %}
{% from '_macros.html' import csrf, excluir %}
{% block conteudo %}
<div class="card">
<h1>{{ 'Editar cliente #' ~ cliente.id if cliente else 'Novo cliente' }}</h1>
<form method="post">
  {{ csrf() }}
  <div class="campos">
    <div><label for="nome">Nome *</label><input id="nome" name="nome" value="{{ f.get('nome','') }}" maxlength="120" required autofocus></div>
    <div><label for="cpf">CPF</label><input id="cpf" name="cpf" value="{{ f.get('cpf','') }}" inputmode="numeric" maxlength="14"></div>
    <div><label for="telefone">Telefone / WhatsApp</label><input id="telefone" name="telefone" value="{{ f.get('telefone','') }}" inputmode="tel" maxlength="30"></div>
    <div><label for="nascimento">Nascimento</label><input id="nascimento" type="date" name="nascimento" value="{{ f.get('nascimento','') }}"></div>
    <div class="largo"><label for="endereco">Endereço</label><input id="endereco" name="endereco" value="{{ f.get('endereco','') }}" maxlength="200"></div>
    <div class="largo"><label for="obs">Observações</label><textarea id="obs" name="obs" rows="3">{{ f.get('obs','') }}</textarea></div>
  </div>
  <p class="mut">O grau dos óculos é cadastrado na receita, depois de salvar o cliente.</p>
  <div class="acoes">
    <button class="btn">Salvar</button>
    <a class="btn sec" href="{{ url_for('clientes.ver', id=cliente.id) if cliente else url_for('clientes.lista') }}">Cancelar</a>
  </div>
</form>
</div>
{% endblock %}
